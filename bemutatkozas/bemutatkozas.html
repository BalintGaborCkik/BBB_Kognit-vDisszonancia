<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../MainStyle.css" />
    <link rel="stylesheet" href="kepnezegeto.css" />

    <script src="../hamburgerMenu.js" defer></script>
    <script src="bemutatkozas.js" defer></script>

    <script defer src="script.js"></script>
    <link rel="stylesheet" href="bemutatkozas.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <input type="button" value="☰" />
      <div>
        <span>Bemutatkozás</span>
        <span>Kognitív Disszonancia</span>
      </div>
    </header>
    <div id="menu">
      <nav>
        <ul>
          <li><a href="../main/index.html">Kezdőlap</a></li>
          <li><a href="../tankolás/tankolas.html">Tankolás</a></li>
        </ul>
      </nav>

      <!-- -->

      <div>
        <main>
          <!-- -->
          <div id="constainer_nyitoSzoveg">
            <img src="../Images/kognitivDisszonancia.png" alt="csapat_logo">
            <p id="nyitoSzoveg">
              Mi vagyunk a Kognitív Disszonancia, a Ceglédi Közgazdasági És
              Informatikai Technikumból jövünk, hogy megmutathassuk Js
              tudásunkat!:)
            </p>
          </div>

          <hr>

          <h1>Csapatunk tagjai</h1>

          <div class="container_bemutatkozas">
            <figure class="bemutatkozoKartya">
              <img src="../Images/Kriszti_hihi.png" alt="Kriszti 𝘩𝘪𝘩𝘪" />
              <figcaption>
                <span class="nev">Molnár Krisztina</span>
                <button class="btn">Info</button>
                <br />
                <span class="bemutatkozas">
                  Sziasztok! Kriszti vagyok, szeretek sütni, főzni, szeretek
                  kreatív lenni, rajzolni és fura vagyok.:p A csapat logót én
                  alkottam meg o_o Nagyon szeretem a Rammsteint hihi
                </span>
              </figcaption>
            </figure>

            <figure class="bemutatkozoKartya">
              <img src="../Images/Kristof.png" alt="Kristóf" />
              <figcaption>
                <span class="nev">Nagy Kristóf</span>
                <button class="btn">Info</button>
                <br />
                <span class="bemutatkozas">Kristóf, te csak Kristóf vagy.</span>
              </figcaption>
            </figure>

            <figure class="bemutatkozoKartya">
              <img src="../Images/Gabor.png" alt="Gábor" />
              <figcaption>
                <span class="nev">Bálint Gábor</span>
                <button class="btn">Info</button>
                <br />
                <span class="bemutatkozas">
                  Bálint Gábor vagyok. A sok mentális zavarom ellenére, komoly
                  helyzetekben jó döntéseket hozok. Szeretek programozni,
                  sakkozni, 3D modellezni, pókerezni és még sorolhatnám...
                </span>
              </figcaption>
            </figure>
          </div>

          <h1>Felkészítő tanáraink</h1>

          <div class="container_bemutatkozas">
            <figure class="bemutatkozoKartya">
              <img src="../Images/Fnl.png" alt="Farkas Norbert" />
              <figcaption>
                <span>Farkas Norbert</span>
                <button class="btn">Info</button>
                <br />
                <span class="bemutatkozas"
                  >Csodás felkészítő tanárunk, Fnl</span
                >
              </figcaption>
            </figure>

            <figure class="bemutatkozoKartya">
              <img src="../Images/Eman.png" alt="Szabó Emánuel" />
              <figcaption>
                <span>Szabó Emánuel</span>
                <button class="btn">Info</button>
                <br />
                <span class="bemutatkozas"
                  >Csodás felkészítő tanárunk, Emán</span
                >
              </figcaption>
            </figure>
          </div>

          <hr>

          <h1>Galéria</h1>
          <h2>A képek megtekintéséhez nyomja meg a gombot:)</h2>

          <div id="container_kepek">
            <input
              type="button"
              id="bezaras"
              value="Bezárás"
              onclick="bezar()"
            />
            <input
              type="button"
              id="gomb"
              value="Képek megnyitása"
              onclick="kovetkezoKep()"
            />
            <div id="kepnezegeto">
              <img id="kep" src="" />
            </div>
          </div>
        </main>
        <footer>valami</footer>
      </div>
    </div>
  </body>
</html>
