    <h1>Csapatunk tagjai</h1>

    <div class="container">
        <figure class="bemutatkozoKartya">
            <img src="../Images/Kriszti_hihi.png" alt="Kriszti 𝘩𝘪𝘩𝘪">
            <figcaption>
                <div class="nev">Molnár Krisztina</div>
                <div class="bemutatkozas">Sziasztok! Kriszti vagyok, szeretek sütni, főzni, szeretek kreatív lenni, rajzolni és fura vagyok.:p A csapat logót én alkottam meg o_o Nagyon szeretem a Rammsteint hihi</div>
            </figcaption>
        </figure>

        <figure class="bemutatkozoKartya">
            <img src="../Images/Kristof.png" alt="Kristóf">

         <figure class="bemutatkozoKartya">

            </figcaption>

        <figure class="bemutatkozoKartya">
            <img src="../Images/Eman.png" alt="Szabó Emánuel">
            <figcaption>
                <div>Szabó Emánuel</div>
